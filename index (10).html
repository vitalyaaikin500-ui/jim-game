<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jim Game Center</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#060608;--panel:#0f0f13;--line:#26262c;--bone:#d4ccb6;--dim:#6b675f;--blood:#a3252d;--blood-d:#4a1015;--crt:#b4b8c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:system-ui,sans-serif;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.07;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.85))}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{padding:12px 16px 6px;font-family:"Courier New",monospace;font-size:17px}
.hrow{display:flex;justify-content:space-between}
.prog{height:2px;background:var(--line);margin-top:8px}.prog i{display:block;height:100%;background:var(--blood)}
#view{flex:1;padding:6px 12px;overflow:auto}
#bar{padding:10px 12px}
button{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 10px;width:100%;letter-spacing:.02em}
button:disabled{opacity:.35}
button.on{background:var(--blood-d);border-color:var(--blood)}
button.big{border-color:var(--bone);font-family:Georgia,serif;font-size:18px;padding:16px}
small{color:var(--dim)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cams{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cams button{padding:12px 0;font-family:"Courier New",monospace}
.side{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;display:grid;gap:8px;align-content:start;text-align:center}
.side b{font-size:13px;color:var(--dim);font-weight:400}
.seen{min-height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
.seen.bad{color:#d9434d;font-weight:700}
.cam{margin-top:10px;min-height:240px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
 font-family:"Courier New",monospace;color:var(--crt);border:1px solid #2a2c31;border-radius:3px;
 background:repeating-linear-gradient(0deg,#08090b 0 2px,#0d0e11 2px 4px);animation:flick 5s infinite}
.cam .top{width:100%;display:flex;justify-content:space-between;font-size:13px}.cam h2{margin:0;font-size:20px;font-weight:400}
.rec{color:#d9434d}.who{font-size:17px;min-height:48px;color:var(--bone)}.ts{font-size:12px;color:#6b6e75;align-self:flex-start}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:16px 8px}
.logo{font-family:Georgia,serif;line-height:.95}
.l1{font-size:76px;letter-spacing:.04em}.l2{font-size:22px;letter-spacing:.32em;color:var(--blood)}
.l1 i{font-style:normal;animation:neon 6s infinite}
.sub{margin:0 0 8px;color:var(--dim);font-style:italic;font-family:Georgia,serif}
.stack{display:grid;gap:10px;width:100%}
h2.t{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0}
.set{width:100%;text-align:left;display:grid;gap:6px}.set b{font-weight:400;color:var(--dim);font-size:14px}
.scare{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:24px}
.scare .face{width:260px;height:260px;position:relative;animation:shake .08s infinite}.face img,.face svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scare h2{color:#d9434d;margin:0;font-family:Georgia,serif;font-weight:400}
.scare button{max-width:320px}
.low{color:#d9434d}
.scene{position:relative;width:100%;aspect-ratio:5/3;overflow:hidden;border:1px solid #2a2c31}.scene>*{position:absolute;inset:0;width:100%;height:100%}.scene img{object-fit:cover}.panel{width:100%;display:block}
.scene::before,.scene::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.scene::before{z-index:3;opacity:.2;mix-blend-mode:screen;animation:static .3s steps(4) infinite;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene::after{z-index:4;background:linear-gradient(180deg,transparent 0 44%,rgba(255,255,255,.09) 50%,transparent 56% 100%);animation:roll 4.5s linear infinite;box-shadow:inset 0 0 60px rgba(0,0,0,.9)}
.scene>svg:first-child,.scene>img{filter:grayscale(1) brightness(1.25) contrast(1.1)}
.scene>svg:last-child{filter:saturate(.75) brightness(.85)}
@keyframes static{25%{background-position:-40px 30px}50%{background-position:30px -50px}75%{background-position:-20px -20px}}
@keyframes roll{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.room{border:1px solid #2a2218;border-radius:3px;overflow:hidden}.room svg{display:block;width:100%}
.ctl{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:8px;margin-top:8px}.ctl .side{border:0;background:none;padding:0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;background:#0f0f13;border:1px solid var(--blood);padding:10px 14px;border-radius:3px;font-size:14px;white-space:nowrap}
.paper{background:#d6cdb0;color:#1a1710;font-family:Georgia,serif;padding:18px;max-width:340px;transform:rotate(-1deg);text-align:left}
.paper h3{margin:6px 0;font-size:20px;line-height:1.15}.paper p{font-size:14px;margin:8px 0}.paper button{background:#1a1710;color:#d6cdb0;margin-top:6px}
.card{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px;font-size:14px}.card b{display:block;margin-bottom:4px;font-size:16px}.card.lock{opacity:.4}
.gtxt{display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;font-size:18px;color:#fff;opacity:.14;text-align:center;padding:20px}
.cam.glitch .scene{animation:jit .12s steps(2) infinite}.cam.glitch .scene::before{opacity:.85}
.end{position:fixed;inset:0;z-index:10;background:#000}.end>svg{position:absolute;left:0;width:100%}
.endbg{top:0;height:100%;filter:brightness(.55) sepia(.5)}.endfire{bottom:0;height:75%}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:burn .4s ease-in-out infinite alternate}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at bottom,rgba(255,120,20,.65),transparent 70%);animation:flick 1.3s infinite}
.endtxt{position:absolute;left:0;right:0;top:10%;text-align:center;padding:0 20px;opacity:0;animation:fadein 2.5s 2.5s forwards}
.endtxt h2{font-family:Georgia,serif;font-weight:400;font-size:34px;color:#ff4a3a;margin:0 0 8px;text-shadow:0 0 18px #000}.endtxt button{max-width:260px;margin-top:16px}
#call{padding:0 12px}
.ver{color:#4a4a52;font-size:11px;margin:4px 0 0}
.callbox{display:flex;gap:10px;align-items:flex-start;background:#0f0f13;border:1px solid #2a2c31;border-radius:3px;padding:8px 10px;font-size:14px}
.callbox small{color:var(--dim)}.callbox button{width:auto;padding:6px 10px;font-size:12px;white-space:nowrap}
.mini{gap:10px}.mini canvas{width:100%;image-rendering:pixelated;background:#000;border:1px solid #2a2218}
.mt{margin:0;font-size:15px;min-height:20px}.mb{min-height:70px;width:100%;text-align:left;font-size:14px}.mb b{color:var(--blood);margin-right:6px}.skipb{max-width:170px;font-size:13px;padding:8px}
.endwrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.endwrap .dk,.endwrap .ow,.endwrap .fo,.endwrap .fc{opacity:0;transition:opacity 2s}
.st1 .dk,.st2 .dk,.st3 .dk{opacity:.9!important}.st4 .dk,.st5 .dk{opacity:.4!important}
.st3 .fo,.st4 .fo,.st5 .fo,.st4 .fc,.st5 .fc{opacity:1!important}.st4 .ow,.st5 .ow{opacity:.35!important}
.st4 .room,.st5 .room{animation:jit .09s steps(2) infinite}
.cap{text-align:center;font-style:italic;color:var(--dim);min-height:22px;margin:10px 0}
.endwrap .endtxt{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;animation:none;transition:opacity 2s}
.st5 .endtxt{opacity:1;pointer-events:auto}
.shake{animation:jit .08s 3}
@keyframes burn{from{transform:scaleY(.8) skewX(-3deg)}to{transform:scaleY(1.15) skewX(4deg)}}
@keyframes fadein{to{opacity:1}}@keyframes jit{50%{transform:translate(3px,-2px)}}
@keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.65}94%{opacity:.95}96%{opacity:.7}}
@keyframes neon{0%,18%,22%,60%,100%{opacity:1}20%,62%{opacity:.25}}
@keyframes shake{50%{transform:translate(5px,-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.endtxt{opacity:1}}
</style></head>
<body><div id="app"><div id="hud"></div><div id="call"></div><div id="view"></div><div id="bar"></div></div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#060608');tg.setBackgroundColor('#060608')}catch(e){}}
const $=id=>document.getElementById(id);

// ---------- ДАННЫЕ ----------
const ROOMS={stage:'Сцена',diner:'Зал закусочной',arcade:'Игровой зал',kitchen:'Кухня',workshop:'Студия робототехники',
  storage:'Склад запчастей',dressing:'Гримёрка',hallL:'Левый коридор',hallR:'Правый коридор',yard:'Задний двор'};
const CAMS=Object.keys(ROOMS);
const SIDES={left:'Левая дверь',window:'Окно',right:'Правая дверь'};
// path: маршрут от сцены до точки атаки (последний элемент = сторона офиса)
const ROBOTS={
  michael:{name:'Майкл',icon:'🎸',path:['stage','diner','arcade','hallL','left']},
  david:{name:'Дэвид',icon:'🥁',path:['stage','diner','kitchen','hallL','left']},
  emma:{name:'Эмма',icon:'🎤',path:['stage','diner','workshop','dressing','hallR','right']},
  sophie:{name:'Софи',icon:'🎹',path:['stage','diner','arcade','storage','hallR','right']},
  jake:{name:'Джейк',icon:'🎷',path:['stage','diner','workshop','storage','yard','window']},
  oliver:{name:'Оливер',icon:'🎻',path:['stage','dressing','storage','yard','window']}
};
// Одна ночь = 6 часов. Уровень ИИ (0-20) для каждого часа:
const HOURS=[
  {michael:3,emma:3},
  {michael:4,emma:4,david:2},
  {michael:5,emma:5,david:4,sophie:3},
  {michael:6,emma:6,david:5,sophie:5,jake:4},
  {michael:7,emma:7,david:6,sophie:6,jake:5,oliver:4},
  {michael:9,emma:9,david:8,sophie:8,jake:7,oliver:7}
];
const CLOCK=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM'];
const MOVE_EVERY=7, DIFF=[.7,1,1.3];
const DRAIN={base:.134,door:.174,light:.174,cam:.087}; // % энергии в секунду

// ---------- СОХРАНЕНИЕ ----------
const V={unlocked:0,done:0,run:{h:0,power:100},eggs:{},set:{vib:1,snd:1},cust:{diff:1,len:60,drain:1,egg:0}};
const cfg=()=>S&&S.custom?V.cust:{diff:1,len:90,drain:1,egg:0};
const store={
  get:k=>Promise.race([new Promise(r=>{try{tg.CloudStorage.getItem(k,(e,v)=>r(e?null:v))}catch(e){try{r(localStorage.getItem(k))}catch(_){r(null)}}}),
    new Promise(r=>setTimeout(()=>r(null),1200))]),
  set:(k,v)=>{try{tg.CloudStorage.setItem(k,v)}catch(e){try{localStorage.setItem(k,v)}catch(_){}}}
};
const persist=()=>store.set('save',JSON.stringify(V));
const buzz=t=>{if(V.set.vib)try{tg?.HapticFeedback?.notificationOccurred(t)}catch(e){}};
const tap=()=>{if(V.set.vib)try{tg?.HapticFeedback?.impactOccurred('light')}catch(e){}};

// ---------- ГРАФИКА (рисуется кодом; свои картинки кладутся в папку img/) ----------
const CH={
 michael:{c:'#3a6fc0',h:'#1d3f87',g:0},david:{c:'#d9792a',h:'#6e350a',g:0},emma:{c:'#d4568f',h:'#7a1f4c',g:1},
 sophie:{c:'#8548c8',h:'#431e80',g:1},jake:{c:'#cdb02a',h:'#5e4e09',g:0},oliver:{c:'#2fa898',h:'#115249',g:0}
};
const EYE={michael:'#7ab4ff',david:'#ffb25a',emma:'#ff7ab8',sophie:'#c89bff',jake:'#ffe45a',oliver:'#6af0dc'};
const INK='#08080a';
const mix=(x,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(x.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const grad=(id,x)=>`<radialGradient id="${id}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${mix(x,.85)}"/><stop offset="1" stop-color="${mix(x,.3)}"/></radialGradient>`;
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute"><defs>${Object.entries(CH).map(([i,o])=>grad('gc_'+i,o.c)+grad('gh_'+i,o.h)).join('')}<radialGradient id="gs" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#cdbda8"/><stop offset="1" stop-color="#6a5f52"/></radialGradient><radialGradient id="gv"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient><linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd23a"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#a3200d"/></linearGradient></defs></svg>`);
const ACC={
 michael:(c,h)=>`<path d="M-16 -75a16 14 0 0 1 32 0z" fill="${c}"/><path d="M3 -76h19l-2 5H3z" fill="${h}"/>`,
 david:(c,h)=>`<path d="M-14 -79l3-13 5 9 4-14 4 14 5-9 3 13z" fill="${h}"/>`,
 emma:(c,h)=>`<path d="M-11 -84l-10-7v14zM-11 -84l10-7v14z" fill="${c}"/><circle cx="-11" cy="-84" r="2.5" fill="#6a5a1a"/>`,
 sophie:(c,h)=>`<circle cx="0" cy="-93" r="10" fill="${h}"/><rect x="-7" y="-85" width="14" height="3.5" rx="1.5" fill="#6a5a1a"/>`,
 jake:(c,h)=>`<path d="M-16 -74a16 15 0 0 1 32 0z" fill="${c}"/><rect x="-16" y="-77" width="32" height="5" rx="2" fill="${h}"/><circle cx="0" cy="-90" r="3.5" fill="#a9a595"/>`,
 oliver:()=>`<circle cx="-5.5" cy="-67" r="7" fill="none"/><circle cx="5.5" cy="-67" r="7" fill="none"/><path d="M-0.5 -67h1"/>`
};
const STAR='<path transform="translate(0 -45) scale(.5)" d="M0 -9l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z" fill="#8a7420" stroke-width="2"/>';
const robotSvg=(id,x,y,k=1,bf=0)=>{const {c,h,g}=CH[id],up=id==='sophie',kf=S&&!S.custom&&H===0,cc=`url(#gc_${id})`,hh=`url(#gh_${id})`,sk='url(#gs)',e=EYE[id];
 const arm=(a,px,sx)=>`<g transform="rotate(${a} ${px} -53)"><rect x="${sx}" y="-54" width="7" height="22" rx="3.5" fill="${sk}"/><rect x="${sx}" y="-54" width="7" height="9" rx="3" fill="${cc}"/></g>`;
 return `<g transform="translate(${x} ${y}) scale(${k})" stroke="${INK}" stroke-width="1.7" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px ${e})">
 ${g?`<path d="M-20 -66C-27 -100 27 -100 20 -66L26 -34Q0 -26 -26 -34Z" fill="${hh}"/><path d="M-15 -60l-3 24M12 -60l4 24" stroke-width="1" opacity=".5"/>`:''}
 <rect x="-8" y="-22" width="5" height="19" fill="${sk}"/><rect x="3" y="-22" width="5" height="19" fill="${sk}"/>
 <ellipse cx="-6" cy="-3" rx="7.5" ry="3.8" fill="#26262b"/><ellipse cx="6" cy="-3" rx="7.5" ry="3.8" fill="#26262b"/>
 <path d="M-14 -55h28l1 20h-30z" fill="${cc}"/><path d="M5 -50l6 2-2 6-5-3z" fill="#000" opacity=".4" stroke="none"/>${STAR}
 ${g?`<path d="M-14 -36H14L23 -18H-23Z" fill="#141418"/><path d="M-23 -18H23" stroke="#8a8676" stroke-width="2.5"/>`:`<rect x="-12" y="-36" width="24" height="17" rx="3" fill="#141418"/>`}
 ${arm(8,-15,-21)}${arm(up?-160:-8,15,14)}
 <circle cx="-14" cy="-52" r="1.6" fill="#5a5a62" stroke-width=".8"/><circle cx="14" cy="-52" r="1.6" fill="#5a5a62" stroke-width=".8"/>
 <circle cx="0" cy="-68" r="15" fill="${sk}"/>${kf?'':`<circle cx="0" cy="-68" r="15" fill="url(#gv)" stroke="none"/>`}
 ${kf?'':`<path d="M9 -81l-3 6 3 4" fill="none" stroke-width=".9" opacity=".7"/>`}
 ${bf?`<circle cx="0" cy="-68" r="15" fill="#000"/><circle cx="-5.5" cy="-67" r="2" fill="#fff" stroke="none"/><circle cx="5.5" cy="-67" r="2" fill="#fff" stroke="none"/>`
 :kf?`<ellipse cx="-5.5" cy="-67" rx="4.4" ry="4.8" fill="#fff"/><ellipse cx="5.5" cy="-67" rx="4.4" ry="4.8" fill="#fff"/>
 <circle cx="-5" cy="-66.5" r="2" fill="#1a1a1a" stroke="none"/><circle cx="6" cy="-66.5" r="2" fill="#1a1a1a" stroke="none"/>
 <circle cx="-4.4" cy="-67.3" r=".7" fill="#fff" stroke="none"/><circle cx="6.6" cy="-67.3" r=".7" fill="#fff" stroke="none"/>
 <circle cx="-10" cy="-62" r="2.6" fill="#e88" opacity=".35" stroke="none"/><circle cx="10" cy="-62" r="2.6" fill="#e88" opacity=".35" stroke="none"/>
 <path d="M-6 -60Q0 -54 6 -60" fill="none" stroke-width="1.6"/>`
 :`<ellipse cx="-5.5" cy="-67" rx="4.7" ry="5.3" fill="#030303"/><ellipse cx="5.5" cy="-67" rx="4.7" ry="5.3" fill="#030303"/>
 <circle cx="-5" cy="-66.5" r="1.5" fill="${e}" stroke="none"/><circle cx="6" cy="-66.5" r="1.5" fill="${e}" stroke="none"/>
 <path d="M-11 -74l9 3.5M11 -74l-9 3.5" fill="none" stroke-width="2.2"/>
 <path d="M-9.5 -60Q0 -46 9.5 -60z" fill="#040404"/><path d="M-8 -59.5h16l-2 3.5-2-3.5-2 3.5-2-3.5-2 3.5-2-3.5-2 3.5z" fill="#cfc8b3" stroke="none"/>
 <path d="M-9.5 -60l-4-1M9.5 -60l4-1" fill="none" stroke-width="1"/>`}
 <path d="M-15 -69Q-17 -86 0 -86Q17 -86 15 -69Q8 -76 0 -74Q-8 -76 -15 -69Z" fill="${hh}"/>
 ${ACC[id](cc,hh)}</g>`};
// Если в папке img лежат готовые рендеры персонажей (char_<имя>.png, прозрачный фон), игра использует их вместо рисунка
const SPR={};
Object.keys(CH).forEach(id=>{const i=new Image();i.onload=()=>{SPR[id]=i.naturalWidth/i.naturalHeight};i.src=`img/char_${id}.png`});
const bot=(id,x,y,k=1,bf=0)=>SPR[id]?`<image href="img/char_${id}.png" x="${x-50*k*SPR[id]}" y="${y-100*k}" width="${100*k*SPR[id]}" height="${100*k}" preserveAspectRatio="xMidYMax meet"${bf?' style="filter:brightness(.12)"':''}/>`:robotSvg(id,x,y,k,bf);
const L='stroke="#3a3d44" fill="#101114" stroke-width="1.5"';
const hall=left=>`<path d="M0 0L110 55V105L0 180zM300 0L190 55V105L300 180z" ${L}/><rect x="110" y="55" width="80" height="50" fill="#050807" stroke="#3a3d44"/>`
  +(left?`<path d="M20 40l35 20v75l-35 25z" fill="#2a2c31" stroke="#4a4e57"/>`:`<path d="M280 40l-35 20v75l35 25z" fill="#2a2c31" stroke="#4a4e57"/>`);

let S=null,H=0,startPower=100,timer=null,askReset=false;
const rnd=n=>1+Math.floor(Math.random()*n);
const ai=id=>Math.min(20,Math.round(HOURS[H][id]*DIFF[cfg().diff]));

function startHour(h,power=100,custom=0){
  if(!custom&&power<25)power=25; // минимум 25% на старте часа, чтобы нельзя было застрять
  H=h;startPower=power;if(!custom){V.run={h,power};persist()}
  S={t:0,power,doors:{left:false,window:false,right:false},lights:{left:false,window:false,right:false},
     cam:false,room:'stage',pos:{},dark:0,over:false};
  Object.keys(HOURS[H]).forEach(id=>S.pos[id]=0);
  S.custom=!!custom;$('call').innerHTML='';
  const ch=q=>rnd(100)<=q*(cfg().egg?6:1);
  S.eg={blood:ch(15),alex:ch(12),james:ch(12)?['diner','hallL','hallR','yard'][rnd(4)-1]:null,glitchAt:ch(30)?10+rnd(35):0,shadowAt:H>=1&&ch(3)?15+rnd(30):0};
  S.glitchEnd=0;S.shadowEnd=0;S.callK=-1;S.muted=0;
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){
  if(S.over)return;
  S.t++;
  const closed=Object.values(S.doors).filter(Boolean).length,lit=Object.values(S.lights).filter(Boolean).length;
  if(S.power>0){
    S.power=Math.max(0,S.power-(DRAIN.base+closed*DRAIN.door+lit*DRAIN.light+(S.cam?DRAIN.cam:0))*cfg().drain);
    if(S.power===0){Object.keys(S.doors).forEach(k=>{S.doors[k]=false;S.lights[k]=false});S.cam=false;buzz('error');powerOut()}
  }else{S.dark++;if(S.dark>=12)return lose(Object.keys(S.pos)[0])}
  callTick();
  if(!S.custom&&S.t%10===0){V.run={h:H,power:Math.ceil(S.power)};persist()}
  if(S.eg.glitchAt&&S.t===S.eg.glitchAt)S.glitchEnd=S.t+4;
  if(S.eg.shadowAt&&S.t===S.eg.shadowAt){S.cam=false;S.shadowEnd=S.t+3;buzz('warning');rumble()}
  if(S.shadowEnd&&S.t>=S.shadowEnd){unlock('black');return lose('shadow')}
  const full=S.t%MOVE_EVERY===0||S.power===0||S.glitchEnd>=S.t||S.shadowEnd;
  if(S.t%MOVE_EVERY===0&&!moveRobots())return;
  if(S.t>=cfg().len)return hourDone();
  full?render():hud();
}
function moveRobots(){
  for(const id of Object.keys(S.pos)){
    if(rnd(20)>ai(id))continue;
    const r=ROBOTS[id],last=r.path.length-1;
    if(S.pos[id]<last){S.pos[id]++;footstep(.03+.16*Math.pow(S.pos[id]/last,2));if(S.pos[id]===last)buzz('warning')}
    else if(S.doors[r.path[last]]){S.pos[id]=1;knock()} // дверь выдержала, робот отступил
    else{lose(id);return false}
  }
  return true;
}

function mini(h,after){
  M={h,after,si:0,jx:80,jy:80,gx:80,gy:80,t:null,tk:null,tm:[]};
  if(SCENES[h].final)return finalScene();
  show(`<div class="center mini"><p id="mt" class="mt"></p><canvas id="cv" width="160" height="100"></canvas><div id="mb" class="mb"></div><button data-a="mskip" class="skipb">Пропустить</button></div>`);
  const cv=$('cv');g=cv.getContext('2d');
  cv.onclick=e=>{const r=cv.getBoundingClientRect();M.gx=(e.clientX-r.left)/r.width*160;M.gy=Math.max(62,(e.clientY-r.top)/r.height*100)};
  nextStep();
  (function loop(){if(!M||M.final)return;mstep();mdraw();M.raf=requestAnimationFrame(loop)})();
}
function nextStep(){
  const st=SCENES[M.h].steps[M.si];if(!st)return endMini();
  M.lock=0;
  if(st.talk){M.t=null;M.tk=st.talk;M.ti=0;return showTalk()}
  M.tk=null;M.room=st.room;M.t=st.t.map(([x,y,k],i)=>({x,y,k,i,done:0}));$('mt').textContent=st.txt;$('mb').innerHTML='';
}
function showTalk(){const [w,t]=M.tk[M.ti];$('mt').textContent='';$('mb').innerHTML=`<b>${w}:</b>${t}<br><button data-a="mnext" style="margin-top:8px;max-width:160px">Дальше</button>`}
function miniNext(){if(!M)return;M.ti++;if(M.ti>=M.tk.length){M.si++;nextStep()}else showTalk()}
function mstep(){
  const dx=M.gx-M.jx,dy=M.gy-M.jy,d=Math.hypot(dx,dy);
  if(d>1.2){M.jx+=dx/d*1.1;M.jy+=dy/d*1.1}
  if(M.t&&!M.lock){
    M.t.forEach(t=>{if(!t.done&&Math.hypot(t.x-M.jx,t.y-M.jy)<9){t.done=1;buzz('success');tone(660,.08,{type:'square',v:.05})}});
    if(M.t.every(t=>t.done)){M.lock=1;M.tm.push(setTimeout(()=>{M.si++;nextStep()},600))}
  }
}
function mdraw(){
  R('#000',0,0,160,100);room(M.room);
  (M.t||[]).forEach(t=>{if(!t.done||t.k==='kid'||t.k==='inst'){if(t.k==='kid')tgt(t);else{g.save();g.translate(t.x,t.y);g.scale(1.6,1.6);tgt({...t,x:0,y:0});g.restore()}}if(t.done&&(t.k==='kid'||t.k==='inst'))R('#cdbf9c',t.x-1,t.y-32,2,2)});

  james(M.jx,M.jy);
}

  show(`<div class="center"><h2 class="t">Настройки</h2>
   ${opt('vib','Вибрация',[[1,'Вкл'],[0,'Выкл']])}
   ${opt('snd','Звук',[[1,'Вкл'],[0,'Выкл']])}
   <button data-a="reset">${askReset?'Точно сбросить? Нажми ещё раз':'Сбросить прогресс'}</button>
   <button data-a="menu">Назад</button></div>`);
}
function customScreen(){
  const o=(k,l,v)=>`<div class="set"><b>${l}</b><div class="row">${v.map(([x,t])=>`<button class="${V.cust[k]===x?'on':''}" data-a="cset" data-k="${k}" data-v="${x}">${t}</button>`).join('')}</div></div>`;
  show(`<div class="center"><h2 class="t">Свой час</h2>${o('diff','Сложность',[[0,'Легко'],[1,'Обычно'],[2,'Тяжело']])}
   ${o('len','Длина часа',[[45,'45 с'],[60,'60 с'],[90,'90 с'],[180,'3 мин']])}
   ${o('drain','Расход энергии',[[.6,'Медл.'],[1,'Обычно'],[1.5,'Быстро'],[2.2,'Жесть']])}
   ${o('egg','Пасхалки',[[0,'Редко'],[1,'Часто']])}
   <button class="big" data-a="play" data-h="5" data-c="1">Начать</button><button data-a="menu">Назад</button></div>`);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset;actx();
  if(a!=='reset')askReset=false;
  if(a==='play')return startHour(+d.h,d.p?+d.p:(+d.c?100:powerFor(+d.h)),+d.c||0);
  if(a==='menu')return menu();
  if(a==='chapters')return chaptersScreen();
  if(a==='eggs')return eggsScreen();
  if(a==='custom')return customScreen();
  if(a==='cset'){V.cust[d.k]=+d.v;persist();return customScreen()}
  if(a==='mute'){if(S){S.muted=1;$('call').innerHTML=''}stopVoice();return}
  if(a==='mnext')return miniNext();
  if(a==='mskip')return endMini();
  if(a==='after')return mini(5,chapterEnd);
  if(a==='dead'){tone(120,.1,{type:'square',v:.06});b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);buzz('error');return}
  if(a==='news')return showNews();
  if(a==='closeNews'){document.querySelector('.np')?.remove();return}
  if(a==='hours')return hoursScreen();
  if(a==='settings')return settingsScreen();
  if(a==='set'){V.set[d.k]=+d.v;persist();return settingsScreen()}
  if(a==='reset'){if(askReset){V.unlocked=0;V.run={h:0,power:100};persist();askReset=false}else askReset=true;return settingsScreen()}
  if(!S||S.over)return;
  if(S.power<=0&&a!=='room'&&a!=='cam')return;
  if(a==='cam'){S.cam=!S.cam;blip()}
  if(a==='room'){S.room=d.r;blip()}
  if(a==='door'){S.doors[d.s]=!S.doors[d.s];doorSnd(S.doors[d.s])}
  if(a==='light'){S.lights[d.s]=!S.lights[d.s];lightSnd(S.lights[d.s])}
  tap();render();
});

(async()=>{
  try{const o=JSON.parse(await store.get('save'));
    if(o){V.unlocked=Math.min(+o.unlocked||0,HOURS.length-1);Object.assign(V.set,o.set||{});Object.assign(V.eggs,o.eggs||{});Object.assign(V.cust,o.cust||{});V.done=o.done||0;if(o.run)Object.assign(V.run,o.run);else V.run.h=V.unlocked}}catch(e){}
  menu();
})();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.over&&!S.custom){V.run={h:H,power:Math.ceil(S.power)};persist()}});
</script></body></html>
