<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jim Game Center</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#060608;--panel:#0f0f13;--line:#26262c;--bone:#d4ccb6;--dim:#6b675f;--blood:#a3252d;--blood-d:#4a1015;--crt:#b4b8c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:system-ui,sans-serif;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.07;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.85))}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{padding:12px 16px 6px;font-family:"Courier New",monospace;font-size:17px}
.hrow{display:flex;justify-content:space-between}
.prog{height:2px;background:var(--line);margin-top:8px}.prog i{display:block;height:100%;background:var(--blood)}
#view{flex:1;padding:6px 12px;overflow:auto}
#bar{padding:10px 12px}
button{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 10px;width:100%;letter-spacing:.02em}
button:disabled{opacity:.35}
button.on{background:var(--blood-d);border-color:var(--blood)}
button.big{border-color:var(--bone);font-family:Georgia,serif;font-size:18px;padding:16px}
small{color:var(--dim)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cams{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cams button{padding:12px 0;font-family:"Courier New",monospace}
.side{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;display:grid;gap:8px;align-content:start;text-align:center}
.side b{font-size:13px;color:var(--dim);font-weight:400}
.seen{min-height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
.seen.bad{color:#d9434d;font-weight:700}
.cam{margin-top:10px;min-height:240px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
 font-family:"Courier New",monospace;color:var(--crt);border:1px solid #2a2c31;border-radius:3px;
 background:repeating-linear-gradient(0deg,#08090b 0 2px,#0d0e11 2px 4px);animation:flick 5s infinite}
.cam .top{width:100%;display:flex;justify-content:space-between;font-size:13px}.cam h2{margin:0;font-size:20px;font-weight:400}
.rec{color:#d9434d}.who{font-size:17px;min-height:48px;color:var(--bone)}.ts{font-size:12px;color:#6b6e75;align-self:flex-start}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:16px 8px}
.logo{font-family:Georgia,serif;line-height:.95}
.l1{font-size:76px;letter-spacing:.04em}.l2{font-size:22px;letter-spacing:.32em;color:var(--blood)}
.l1 i{font-style:normal;animation:neon 6s infinite}
.sub{margin:0 0 8px;color:var(--dim);font-style:italic;font-family:Georgia,serif}
.stack{display:grid;gap:10px;width:100%}
h2.t{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0}
.set{width:100%;text-align:left;display:grid;gap:6px}.set b{font-weight:400;color:var(--dim);font-size:14px}
.scare{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:24px}
.scare .face{width:260px;height:260px;position:relative;animation:shake .08s infinite}.face img,.face svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scare h2{color:#d9434d;margin:0;font-family:Georgia,serif;font-weight:400}
.scare button{max-width:320px}
.low{color:#d9434d}
.scene{position:relative;width:100%;aspect-ratio:5/3;overflow:hidden;border:1px solid #2a2c31}.scene>*{position:absolute;inset:0;width:100%;height:100%}.scene img{object-fit:cover}.panel{width:100%;display:block}
.scene::before,.scene::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.scene::before{z-index:3;opacity:.2;mix-blend-mode:screen;animation:static .3s steps(4) infinite;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene::after{z-index:4;background:linear-gradient(180deg,transparent 0 44%,rgba(255,255,255,.09) 50%,transparent 56% 100%);animation:roll 4.5s linear infinite;box-shadow:inset 0 0 60px rgba(0,0,0,.9)}
.scene>svg:first-child,.scene>img{filter:grayscale(1) brightness(1.25) contrast(1.1)}
.scene>svg:last-child{filter:saturate(.75) brightness(.85)}
@keyframes static{25%{background-position:-40px 30px}50%{background-position:30px -50px}75%{background-position:-20px -20px}}
@keyframes roll{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.65}94%{opacity:.95}96%{opacity:.7}}
@keyframes neon{0%,18%,22%,60%,100%{opacity:1}20%,62%{opacity:.25}}
@keyframes shake{50%{transform:translate(5px,-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="app"><div id="hud"></div><div id="view"></div><div id="bar"></div></div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#060608');tg.setBackgroundColor('#060608')}catch(e){}}
const $=id=>document.getElementById(id);

// ---------- ДАННЫЕ ----------
const ROOMS={stage:'Сцена',diner:'Зал закусочной',arcade:'Игровой зал',kitchen:'Кухня',workshop:'Студия робототехники',
  storage:'Склад запчастей',dressing:'Гримёрка',hallL:'Левый коридор',hallR:'Правый коридор',yard:'Задний двор'};
const CAMS=Object.keys(ROOMS);
const SIDES={left:'Левая дверь',window:'Окно',right:'Правая дверь'};
// path: маршрут от сцены до точки атаки (последний элемент = сторона офиса)
const ROBOTS={
  michael:{name:'Майкл',icon:'🎸',path:['stage','diner','arcade','hallL','left']},
  david:{name:'Дэвид',icon:'🥁',path:['stage','diner','kitchen','hallL','left']},
  emma:{name:'Эмма',icon:'🎤',path:['stage','diner','workshop','dressing','hallR','right']},
  sophie:{name:'Софи',icon:'🎹',path:['stage','diner','arcade','storage','hallR','right']},
  jake:{name:'Джейк',icon:'🎷',path:['stage','diner','workshop','storage','yard','window']},
  oliver:{name:'Оливер',icon:'🎻',path:['stage','dressing','storage','yard','window']}
};
// Одна ночь = 6 часов. Уровень ИИ (0-20) для каждого часа:
const HOURS=[
  {michael:3,emma:3},
  {michael:4,emma:4,david:2},
  {michael:5,emma:5,david:4,sophie:3},
  {michael:6,emma:6,david:5,sophie:5,jake:4},
  {michael:7,emma:7,david:6,sophie:6,jake:5,oliver:4},
  {michael:9,emma:9,david:8,sophie:8,jake:7,oliver:7}
];
const CLOCK=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM'];
const MOVE_EVERY=5, DIFF=[.7,1,1.3];
const DRAIN={base:.2,door:.26,light:.26,cam:.13}; // % энергии в секунду

// ---------- СОХРАНЕНИЕ ----------
const V={unlocked:0,set:{diff:1,len:60,vib:1}};
const store={
  get:k=>Promise.race([new Promise(r=>{try{tg.CloudStorage.getItem(k,(e,v)=>r(e?null:v))}catch(e){try{r(localStorage.getItem(k))}catch(_){r(null)}}}),
    new Promise(r=>setTimeout(()=>r(null),1200))]),
  set:(k,v)=>{try{tg.CloudStorage.setItem(k,v)}catch(e){try{localStorage.setItem(k,v)}catch(_){}}}
};
const persist=()=>store.set('save',JSON.stringify(V));
const buzz=t=>{if(V.set.vib)try{tg?.HapticFeedback?.notificationOccurred(t)}catch(e){}};
const tap=()=>{if(V.set.vib)try{tg?.HapticFeedback?.impactOccurred('light')}catch(e){}};

// ---------- ГРАФИКА (рисуется кодом; свои картинки кладутся в папку img/) ----------
const CH={
 michael:{c:'#3a78d8',h:'#1d3f87',g:0},david:{c:'#ee8a2c',h:'#7a3d0b',g:0},emma:{c:'#ec5ea3',h:'#8f2358',g:1},
 sophie:{c:'#9150dc',h:'#4b1f8a',g:1},jake:{c:'#ecc82f',h:'#6e5a0a',g:0},oliver:{c:'#33bfae',h:'#146257',g:0}
};
const SK='#f3c9a5',INK='#0b0b0d';
const ACC={
 michael:(c,h)=>`<path d="M-16 -75a16 14 0 0 1 32 0z" fill="${c}"/><path d="M3 -76h19l-2 5H3z" fill="${h}"/>`,
 david:(c,h)=>`<path d="M-14 -79l3-13 5 9 4-14 4 14 5-9 3 13z" fill="${h}"/>`,
 emma:(c,h)=>`<path d="M-11 -84l-10-7v14zM-11 -84l10-7v14z" fill="${c}"/><circle cx="-11" cy="-84" r="2.5" fill="#f6d02f"/>`,
 sophie:(c,h)=>`<circle cx="0" cy="-93" r="10" fill="${h}"/><rect x="-7" y="-85" width="14" height="3.5" rx="1.5" fill="#f6d02f"/>`,
 jake:(c,h)=>`<path d="M-16 -74a16 15 0 0 1 32 0z" fill="${c}"/><rect x="-16" y="-77" width="32" height="5" rx="2" fill="${h}"/><circle cx="0" cy="-90" r="3.5" fill="#fff"/>`,
 oliver:(c,h)=>`<circle cx="-5.5" cy="-69" r="6.5" fill="none"/><circle cx="5.5" cy="-69" r="6.5" fill="none"/><path d="M-0.5 -69h1"/>`
};
const STAR='<path transform="translate(0 -45) scale(.5)" d="M0 -9l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z" fill="#f6d02f" stroke-width="2"/>';
const robotSvg=(id,x,y,k=1)=>{const {c,h,g}=CH[id],up=id==='sophie';
 return `<g transform="translate(${x} ${y}) scale(${k})" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px ${c})">
 ${g?`<path d="M-19 -68C-24 -98 24 -98 19 -68L24 -36Q0 -30 -24 -36z" fill="${h}"/>`:''}
 <rect x="-8" y="-22" width="5" height="19" fill="${SK}"/><rect x="3" y="-22" width="5" height="19" fill="${SK}"/>
 <ellipse cx="-6" cy="-3" rx="7" ry="3.5" fill="${c}"/><ellipse cx="6" cy="-3" rx="7" ry="3.5" fill="${c}"/>
 <path d="M-14 -55h28l1 20h-30z" fill="${c}"/>${STAR}
 ${g?`<path d="M-14 -36H14L23 -18H-23Z" fill="#1d1d24"/><path d="M-23 -18H23" stroke="#fff" stroke-width="2.5"/>`:`<rect x="-12" y="-36" width="24" height="17" rx="3" fill="#1d1d24"/>`}
 <g transform="rotate(8 -15 -53)"><rect x="-21" y="-54" width="7" height="22" rx="3.5" fill="${SK}"/><rect x="-21" y="-54" width="7" height="9" rx="3" fill="${c}"/></g>
 <g transform="rotate(${up?-160:-8} 15 -53)"><rect x="14" y="-54" width="7" height="22" rx="3.5" fill="${SK}"/><rect x="14" y="-54" width="7" height="9" rx="3" fill="${c}"/></g>
 <circle cx="0" cy="-68" r="15" fill="${SK}"/>
 <path d="M-15 -69Q-17 -86 0 -86Q17 -86 15 -69Q8 -76 0 -74Q-8 -76 -15 -69Z" fill="${h}"/>
 <circle cx="-5.5" cy="-67" r="4.3" fill="#fff"/><circle cx="5.5" cy="-67" r="4.3" fill="#fff"/>
 <circle cx="-5" cy="-67" r="1.7" fill="${INK}" stroke="none"/><circle cx="6" cy="-67" r="1.7" fill="${INK}" stroke="none"/>
 <path d="M-8 -60Q0 -51 8 -60Z" fill="#fff" stroke-width="1.3"/>
 ${ACC[id](c,h)}</g>`};
const L='stroke="#3a3d44" fill="#101114" stroke-width="1.5"';
const hall=left=>`<path d="M0 0L110 55V105L0 180zM300 0L190 55V105L300 180z" ${L}/><rect x="110" y="55" width="80" height="50" fill="#050807" stroke="#3a3d44"/>`
  +(left?`<path d="M20 40l35 20v75l-35 25z" fill="#2a2c31" stroke="#4a4e57"/>`:`<path d="M280 40l-35 20v75l35 25z" fill="#2a2c31" stroke="#4a4e57"/>`);
const SCENE={
 stage:`<path d="M0 0h52q-12 75 0 150H0zM300 0h-52q12 75 0 150h52z" fill="#1c0e10" stroke="#3a1a1d"/><rect x="40" y="135" width="220" height="15" ${L}/><path d="M80 0l-20 135h40zM220 0l-20 135h40z" fill="#c8ccd4" opacity=".12"/>`,
 diner:`<ellipse cx="70" cy="128" rx="34" ry="7" ${L}/><path d="M70 135v15M170 138v12" stroke="#3a3d44" stroke-width="4"/><ellipse cx="170" cy="132" rx="30" ry="6" ${L}/><rect x="235" y="95" width="65" height="55" ${L}/>`,
 arcade:[30,110,190].map(x=>`<path d="M${x} 150V70l8-10h44l8 10v80z" ${L}/><rect x="${x+8}" y="76" width="44" height="28" fill="#2a3140"/>`).join(''),
 kitchen:`<rect x="0" y="105" width="300" height="45" ${L}/><path d="M60 0v40h110V0" ${L}/><circle cx="220" cy="95" r="10" ${L}/><rect x="40" y="88" width="30" height="17" ${L}/>`,
 workshop:`<rect x="30" y="110" width="140" height="12" ${L}/><path d="M40 122v28M160 122v28" stroke="#3a3d44" stroke-width="5"/><path d="M230 0v50l30 30" stroke="#4a4e57" stroke-width="7" fill="none"/><circle cx="262" cy="84" r="8" ${L}/>`,
 storage:`<path d="M20 40h260M20 85h260M20 130h260" stroke="#3a3d44" stroke-width="3"/><rect x="35" y="14" width="40" height="26" ${L}/><rect x="120" y="58" width="50" height="27" ${L}/><rect x="210" y="104" width="45" height="26" ${L}/>`,
 dressing:`<rect x="12" y="30" width="52" height="75" fill="#050607" stroke="#5a5e68"/><rect x="95" y="28" width="120" height="82" ${L}/>`+[105,130,155,180,205].map(x=>`<circle cx="${x}" cy="20" r="4" fill="#c9c18a" opacity=".5"/>`).join('')+`<rect x="85" y="118" width="140" height="14" ${L}/>`,
 hallL:hall(true),hallR:hall(false),
 yard:`<circle cx="240" cy="35" r="14" fill="#d0d3da" opacity=".45"/><rect x="215" y="55" width="85" height="95" ${L}/><rect x="235" y="75" width="45" height="40" fill="#0d0f12" stroke="#5a5e68"/>`
   +`<path d="${Array.from({length:11},(_,i)=>`M${i*20+10} 150V102l4-6 4 6V150`).join('')}M0 115h210" stroke="#3a3d44" fill="none" stroke-width="2"/>`
};
const sceneSvg=r=>`<svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice"><rect width="300" height="180" fill="#08090b"/><rect y="150" width="300" height="30" fill="#0c0d10"/>${SCENE[r]}</svg>`;
const noPhoto=new Set();
const photo=k=>noPhoto.has(k)?'':`<img src="img/${k}.jpg" alt="" onerror="noPhoto.add('${k}');this.remove()">`;
function scareFace(id){const {c,h,g}=CH[id];
 return `<div class="face"><img src="img/scare_${id}.jpg" alt="" onerror="this.remove()" onload="this.nextElementSibling.remove()"><svg viewBox="0 0 200 200" stroke="${INK}" stroke-width="4" stroke-linejoin="round" style="filter:drop-shadow(0 0 14px ${c})">
 ${g?`<path d="M20 110C0 -10 200 -10 180 110L190 190Q100 205 10 190Z" fill="${h}"/>`:''}
 <circle cx="100" cy="105" r="72" fill="${SK}"/>
 <path d="M28 100Q20 20 100 22Q180 20 172 100Q150 62 100 66Q50 62 28 100Z" fill="${h}"/>
 <circle cx="68" cy="100" r="19" fill="#fff"/><circle cx="132" cy="100" r="19" fill="#fff"/>
 <circle cx="68" cy="100" r="5" fill="${INK}" stroke="none"/><circle cx="132" cy="100" r="5" fill="${INK}" stroke="none"/>
 <path d="M52 138Q100 195 148 138Z" fill="#fff"/><path d="M68 144v14M84 150v16M100 152v16M116 150v16M132 144v14" fill="none" stroke-width="2.5"/></svg></div>`}
function panel(s){
 const closed=S.doors[s],lit=S.lights[s],w=who(s),win=s==='window';let g;
 if(closed)g=win?`<rect x="10" y="10" width="80" height="110" fill="#23262b"/>`+Array.from({length:9},(_,i)=>`<path d="M10 ${22+i*12}h80" stroke="#0c0d10" stroke-width="3"/>`).join('')
   :`<rect x="10" y="10" width="80" height="110" fill="#262a30"/><path d="M10 65h80M50 10v110" stroke="#0c0d10" stroke-width="2"/><circle cx="${s==='left'?78:22}" cy="68" r="4" fill="#a3252d"/>`;
 else if(lit)g=`<rect x="10" y="10" width="80" height="110" fill="${win?'#14222e':'#2d3036'}"/><path d="M10 120L50 40 90 120z" fill="#c9c18a" opacity=".07"/>`+w.map((id,i)=>robotSvg(id,50+(i-(w.length-1)/2)*26,122,.95)).join('');
 else g=`<rect x="10" y="10" width="80" height="110" fill="#020203"/>`;
 return `<svg class="panel" viewBox="0 0 100 130"><rect x="4" y="4" width="92" height="122" fill="#050506" stroke="#3a3a42" stroke-width="3"/>${g}</svg>`;
}

// ---------- ИГРА ----------
let S=null,H=0,startPower=100,timer=null,askReset=false;
const rnd=n=>1+Math.floor(Math.random()*n);
const ai=id=>Math.min(20,Math.round(HOURS[H][id]*DIFF[V.set.diff]));

function startHour(h,power=100){
  H=h;startPower=power;
  S={t:0,power,doors:{left:false,window:false,right:false},lights:{left:false,window:false,right:false},
     cam:false,room:'stage',pos:{},dark:0,over:false};
  Object.keys(HOURS[H]).forEach(id=>S.pos[id]=0);
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){
  if(S.over)return;
  S.t++;
  const closed=Object.values(S.doors).filter(Boolean).length,lit=Object.values(S.lights).filter(Boolean).length;
  if(S.power>0){
    S.power=Math.max(0,S.power-(DRAIN.base+closed*DRAIN.door+lit*DRAIN.light+(S.cam?DRAIN.cam:0)));
    if(S.power===0){Object.keys(S.doors).forEach(k=>{S.doors[k]=false;S.lights[k]=false});S.cam=false;buzz('error')}
  }else{S.dark++;if(S.dark>=12)return lose(Object.keys(S.pos)[0])}
  const full=S.t%MOVE_EVERY===0||S.power===0;
  if(S.t%MOVE_EVERY===0&&!moveRobots())return;
  if(S.t>=V.set.len)return hourDone();
  full?render():hud();
}
function moveRobots(){
  for(const id of Object.keys(S.pos)){
    if(rnd(20)>ai(id))continue;
    const r=ROBOTS[id],last=r.path.length-1;
    if(S.pos[id]<last){S.pos[id]++;if(S.pos[id]===last)buzz('warning')}
    else if(S.doors[r.path[last]])S.pos[id]=1; // дверь выдержала, робот отступил
    else{lose(id);return false}
  }
  return true;
}
function show(html){$('view').innerHTML=html;$('hud').innerHTML='';$('bar').innerHTML=''}
function lose(id){
  S.over=true;clearInterval(timer);buzz('error');
  const r=ROBOTS[id];
  show(`<div class="scare">${scareFace(id)}<h2>${r.name} добрался до тебя</h2>
  <p>Час ${H+1}, ${CLOCK[H]}</p>
  <button class="big" data-a="play" data-h="${H}" data-p="${startPower}">Заново: час ${H+1}</button>
  <button data-a="menu">В меню</button></div>`);
}
function hourDone(){
  S.over=true;clearInterval(timer);buzz('success');
  const last=H>=HOURS.length-1;
  V.unlocked=Math.max(V.unlocked,Math.min(H+1,HOURS.length-1));persist();
  show(last
   ?`<div class="center"><h2 class="t">6:00 AM</h2><p>Ты пережил ночь.</p><button class="big" data-a="menu">В меню</button></div>`
   :`<div class="center"><h2 class="t">${CLOCK[H+1]}</h2><p>Час ${H+1} позади.</p>
     <button class="big" data-a="play" data-h="${H+1}" data-p="${Math.ceil(S.power)}">Дальше: час ${H+2}</button>
     <button data-a="menu">В меню</button></div>`);
}

// ---------- ЭКРАНЫ ----------
function hud(){
  $('hud').innerHTML=`<div class="hrow"><span>${CLOCK[H]}</span><span>Час ${H+1}</span><span class="${S.power<20?'low':''}">⚡ ${Math.ceil(S.power)}%</span></div>
   <div class="prog"><i style="width:${Math.min(100,S.t/V.set.len*100)}%"></i></div>`;
}
function render(){
  hud();
  $('view').innerHTML=S.cam?camView():officeView();
  $('bar').innerHTML=`<div class="row"><button data-a="cam" class="${S.cam?'on':''}">${S.cam?'В офис':'Камеры'}</button><button data-a="menu">Меню</button></div>`;
}
function who(side){return Object.keys(S.pos).filter(id=>{const p=ROBOTS[id].path;return S.pos[id]===p.length-1&&p[p.length-1]===side})}
function officeView(){
  return `<div class="row">`+Object.keys(SIDES).map(s=>{
    const w=S.lights[s]?who(s):[];
    return `<div class="side"><b>${SIDES[s]}</b>${panel(s)}
      <div class="seen ${w.length?'bad':''}">${S.lights[s]?(w.length?w.map(i=>ROBOTS[i].name).join(', '):'никого'):'темно'}</div>
      <button data-a="door" data-s="${s}" class="${S.doors[s]?'on':''}">${S.doors[s]?'Закрыто':'Открыто'}</button>
      <button data-a="light" data-s="${s}" class="${S.lights[s]?'on':''}">Свет</button></div>`}).join('')+`</div>`;
}
function camView(){
  const here=Object.keys(S.pos).filter(id=>ROBOTS[id].path[S.pos[id]]===S.room);
  const n=String(CAMS.indexOf(S.room)+1).padStart(2,'0');
  const hl=S.room.startsWith('hall'),y=S.room==='stage'?135:hl?122:149,k=hl?.7:S.room==='stage'?.95:1;
  const rob=here.map((id,i)=>robotSvg(id,150+(i-(here.length-1)/2)*62,y,k)).join('');
  return `<div class="cams">${CAMS.map((r,i)=>`<button data-a="room" data-r="${r}" class="${S.room===r?'on':''}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div>
  <div class="cam"><div class="top"><span class="rec">● REC</span><span>CAM ${n}</span></div>
  <div class="scene">${sceneSvg(S.room)}${photo('cam_'+S.room)}<svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice">${rob}</svg></div>
  <h2>${ROOMS[S.room]}</h2><div class="ts">${CLOCK[H]}</div></div>`;
}
function menu(){
  clearInterval(timer);S=null;
  const c=V.unlocked>0;
  show(`<div class="center"><div class="logo"><div class="l1">J<i>I</i>M</div><div class="l2">GAME CENTER</div></div>
  <p class="sub">Человек, который открыл окно</p>
  <div class="stack">
   ${c?`<button class="big" data-a="play" data-h="${V.unlocked}">Продолжить: час ${V.unlocked+1}</button>`:''}
   <button class="${c?'':'big'}" data-a="play" data-h="0">${c?'С первого часа':'Начать'}</button>
   <button data-a="hours">Выбор часа</button>
   <button data-a="settings">Настройки</button>
   <button disabled>Дело (скоро)</button></div></div>`);
}
function hoursScreen(){
  show(`<div class="center"><h2 class="t">Выбор часа</h2><div class="g3">${HOURS.map((_,i)=>
   `<button ${i>V.unlocked?'disabled':''} data-a="play" data-h="${i}">Час ${i+1}<br><small>${CLOCK[i]}</small></button>`).join('')}</div>
   <button data-a="menu">Назад</button></div>`);
}
function settingsScreen(){
  const opt=(k,label,vals)=>`<div class="set"><b>${label}</b><div class="row">${vals.map(([v,t])=>
    `<button class="${V.set[k]===v?'on':''}" data-a="set" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  show(`<div class="center"><h2 class="t">Настройки</h2>
   ${opt('diff','Сложность',[[0,'Легко'],[1,'Нормально'],[2,'Тяжело']])}
   ${opt('len','Длина часа',[[45,'45 сек'],[60,'60 сек'],[90,'90 сек']])}
   ${opt('vib','Вибрация',[[1,'Вкл'],[0,'Выкл']])}
   <button data-a="reset">${askReset?'Точно сбросить? Нажми ещё раз':'Сбросить прогресс'}</button>
   <button data-a="menu">Назад</button></div>`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a!=='reset')askReset=false;
  if(a==='play')return startHour(+d.h,d.p?+d.p:100);
  if(a==='menu')return menu();
  if(a==='hours')return hoursScreen();
  if(a==='settings')return settingsScreen();
  if(a==='set'){V.set[d.k]=+d.v;persist();return settingsScreen()}
  if(a==='reset'){if(askReset){V.unlocked=0;persist();askReset=false}else askReset=true;return settingsScreen()}
  if(!S||S.over)return;
  if(S.power<=0&&a!=='room'&&a!=='cam')return;
  if(a==='cam')S.cam=!S.cam;
  if(a==='room')S.room=d.r;
  if(a==='door')S.doors[d.s]=!S.doors[d.s];
  if(a==='light')S.lights[d.s]=!S.lights[d.s];
  tap();render();
});

(async()=>{
  try{const o=JSON.parse(await store.get('save'));
    if(o){V.unlocked=Math.min(+o.unlocked||0,HOURS.length-1);Object.assign(V.set,o.set||{})}}catch(e){}
  menu();
})();
</script></body></html>
